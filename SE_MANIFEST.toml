# ============================================================
# SE_MANIFEST.toml (Repository Declaration)
# ============================================================

schema = "se-manifest-schema"
schema_version = "0.5.2"
schema_url = "https://raw.githubusercontent.com/structural-explainability/se-manifest-schema/main/manifest-schema.toml"

# === Framework Context ===

[meta]
framework = "Structural Explainability"
framework_url = "https://github.com/structural-explainability"
purpose = "Declares this repository's role in the Structural Explainability ecosystem."

# === Repository Identity ===

[repository]
organization = "structural-explainability"
name = "se-theory-identity-regimes"
class = "theory"
kind = "foundation"
status = "active"
since = "2026"
summary = "Formalizes candidate identity regimes, derives conditional transformation classifications, and studies generated identity relations and their limits."

# === Layer Position ===

[layer]
space = "formal-theory"
role = "theory"

# === Dependency Declarations ===

[depends]
# Required upstream repository dependencies.
required = [
    { repository = "se-theory-neutral-substrate", kind = "semantic" },
    { repository = "se-theory-persistence", kind = "semantic"},
]

# Optional upstream repository dependencies.
optional = []

# === Provided Artifacts ===

[provides]
# Logical artifacts exposed by this repository.
# These are stable identifiers, not file paths.
artifacts = [
    "lean-library",
    "theorem-set",
    "regime-classification-matrix",
    "regime-families",
    "regime-profile-derivation",
    "regime-profiles",
    "regime-transformations",
]

# === Scope ===

[scope]
includes = [
    "canonical identity regimes",
    "regime requirement structure",
    "regime-profile structure",
    "neutral-substrate-relative regime application admissibility",
    "admissibility conditions for regime application over neutral substrates",
    "finite profile-count and classification-distinction results",
    "proof-certified derived classifications from invariant bases and effect models",
    "conditional equality and separation results for step-generated identity relations",
    "machine-checked Lean theorems",
    "machine-readable reference artifacts for transformation and classification layers",
]

excludes = [
    "neutral substrate primitives",
    "foundational definitions of individuation, co-reference, and persistence",
    "mapping semantics",
    "repository governance rules",
    "schema definitions for other repositories",
    "domain-specific mappings or data",
    "runtime systems",
]

# === Validation ===

[validation]
# Validates repository declaration, manifest schema conformance,
# reference artifacts, generated artifacts, and Lean public surface coverage.
export_check_entrypoint = "uvx se-theory-reference-kit@latest export --check"
reference_entrypoint = "uvx se-theory-reference-kit@latest validate"
strict_entrypoint = "uvx se-theory-reference-kit@latest validate --strict"

# === Behavior / governance ===

[naming]
pattern = "se-theory-*"

[governance]
authority = "structural-explainability"

# === External references ===

[citation]
cff = "CITATION.cff"
preferred = "CITATION.cff"

[traceability]
identifier_map = "reference/theory-reference.toml"
