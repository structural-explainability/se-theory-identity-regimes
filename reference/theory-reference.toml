# ============================================================
# reference/theory-reference.toml
# ============================================================
# Theory reference configuration for se-theory-reference-kit.
#
# The repository owns the TOML reference artifacts below.
# JSON under data/identity-regimes is generated from these files.

schema = "se-theory-reference"
schema_version = "0.1.0"

[repository]
organization = "structural-explainability"
name = "se-theory-identity-regimes"
theory = "identity-regimes"
description = "Identity regimes theory repository for Structural Explainability."

[lean]
root_module = "SE.IdentityRegimes"
public_modules = [
  "SE.IdentityRegimes",
]
test_modules = [
  "SETest",
]

[reference]
root = "reference"

[export]
root = "data/identity-regimes"

# Generic Lean-surface registries and theory-specific reference tables.
[surface_kinds]
type = "reference/regime-types.toml"
predicate = "reference/regime-predicates.toml"
theorem = "reference/regime-theorems.toml"
vocabulary = "reference/regime-vocabulary.toml"
witness = "reference/regime-witnesses.toml"
family = "reference/regime-families.toml"
profile = "reference/regime-profiles.toml"
transformation = "reference/regime-transformations.toml"
classification = "reference/regime-classification-values.toml"
matrix = "reference/regime-classification-matrix.toml"
derivation = "reference/regime-profile-derivation.toml"
dependency = "reference/dependency-registry.toml"
traceability = "reference/traceability-registry.toml"

# Every JSON artifact below is generated; do not hand-edit data/identity-regimes.
[export_map]
catalog = "data/identity-regimes/identity-regime-catalog.json"
type = "data/identity-regimes/regime-type-registry.json"
predicate = "data/identity-regimes/regime-predicate-registry.json"
theorem = "data/identity-regimes/regime-theorem-registry.json"
vocabulary = "data/identity-regimes/regime-vocabulary-registry.json"
witness = "data/identity-regimes/regime-witness-registry.json"
family = "data/identity-regimes/regime-family-registry.json"
profile = "data/identity-regimes/regime-profile-registry.json"
transformation = "data/identity-regimes/regime-transformation-registry.json"
classification = "data/identity-regimes/regime-classification-value-registry.json"
matrix = "data/identity-regimes/regime-classification-matrix.json"
derivation = "data/identity-regimes/regime-profile-derivation.json"
dependency = "data/identity-regimes/dependency-registry.json"
traceability = "data/identity-regimes/traceability-registry.json"
