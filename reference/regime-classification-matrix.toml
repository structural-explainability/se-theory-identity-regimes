# ============================================================
# Regime Classification Matrix
# se-theory-identity-regimes
# ============================================================
# Canonical 9 x 10 matrix assigning IGN/PRS/BRK to every
# (Regime, Transformation) pair.
#
# N/A -> IGN CONVENTION
# Paper cells marked N/A are represented here as IGN so the executable
# three-valued matrix preserves the PRS-generated relation without adding
# a fourth applicability value. This is an intentional representation
# convention; N/A and IGN are not claimed to be semantically equivalent.
#
# Verified counts: PRS=22, BRK=20, IGN=48, total=90.
# Matrix values are unchanged from the validated 0.2.x reference matrix.

