# ============================================================
# lakefile.toml
# ============================================================
# Declares the public Lean package identity, import surface,
# build targets, dependencies, and verification executables.

# ============================================================
# PROJECT IDENTITY
# ============================================================

name = "SETheoryIdentityRegimes"
version = "0.4.0"
license = "MIT"

keywords = [
  "structural-explainability",
  "formal-contract",
  "neutrality",
  "identity-regimes",
  "invariants",
  "formal-specification",
  "formal-verification",
  "proof-carrying",
  "theorem-proving",
  "lean4",
]

# ============================================================
# BUILD SURFACE
# ============================================================
# defaultTargets must include the public Lean library root.

defaultTargets = ["SE.IdentityRegimes"]

[[require]]
name = "SETheoryNeutralSubstrate"
scope = "git"
git = "https://github.com/structural-explainability/se-theory-neutral-substrate"
rev = "v0.6.0"

[[require]]
name = "SETheoryTransformation"
scope = "git"
git = "https://github.com/structural-explainability/se-theory-transformation"
rev = "v0.3.0"

# ============================================================
# PUBLIC LIBRARY
# ============================================================
# Downstream Lean projects import this library root.
# Lake discovers modules under the matching source directory.

[[lean_lib]]
name = "SE.IdentityRegimes"

# === TEST LIBRARIES (internal, not exported)

[[lean_lib]]
name = "TestImport"
srcDir = "test"

[[lean_lib]]
name = "TestExport"
srcDir = "test"
